@switch (page()) {
@case ('home') {
<app-home [auth]="auth" (loggedIn)="onLoggedIn()" />
}
@case ('book') {
<app-book [service]="cardService" [skills]="skillService" (navigate)="navigate($event)" />
}
@case ('lobby') {
<app-lobby [games]="gameService" (navigate)="navigate($event)" />
}
@case ('puzzle') {
<app-perguntas [service]="puzzleService" />
}
@case ('partida/:id') {
<app-partida [service]="gameService" [partidaId]="partidaId()" />
}
@case ('ranking') {
<app-ranking [ranking]="rankingService" [playerId]="auth.session()?.user?.id ?? null" (navigate)="navigate($event)" />
}
@case ('perfil') {
<app-profile [profiles]="profileService" (navigate)="navigate($event)" />
}
@case ('admin') { <app-admin section="home" /> }
@case ('admin/cartas') { <app-admin section="cartas" /> }
@case ('admin/skills') { <app-admin section="skills" /> }
@case ('admin/puzzles') { <app-admin section="puzzles" /> }
}
