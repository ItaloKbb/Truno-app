<section id="catalago de cartas"
  class="container min-w-screen grid grid-colors-1 md:grid-cols-2 lg:grid-cols-4 justify-items-center gap-4 py-8">

  @for (card of cards; track card.id) {
  <div class="hover-3d">
    <!-- content -->
    <figure class="w-60 overflow-hidden rounded-2xl p-2">
      <img
        class="block h-auto w-full"
        [src]="card.url"
        [alt]="card.valor + ' de ' + card.naipe.toLowerCase()"
        loading="lazy"
      />
    </figure>
    <!-- 8 empty divs needed for the 3D effect -->
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
  </div>

  }
</section>
