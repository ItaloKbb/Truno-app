<!--
  BASE DA TELA — o guia está em src/app/pages/guias/catalogo.md.
  Esta tela só desenha o layout. Falta ligar ao CardService.
-->
@if (loadError$(); as message) {
<p role="alert">{{message}}</p>
}@else if (cards$ | async; as cards) {
<section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 justify-items-center gap-4 py-4">
  @for (card of cards; track card.id) {
  <div class="hover-3d">
    <figure class="w-60 overflow-hidden rounded-2xl p-2">
      <img class="block h-auto w-full" [src]="card.url" [alt]="card.valor + ' de ' + card.naipe.toLowerCase()" />
    </figure>
    <!-- 8 divs vazias são necessárias para o efeito 3D -->
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
  </div>
  }@empty {
  <p>Nenhuma carta encontrada.</p>
  }
</section>

} @else {
<p>
  Carregando cartas...
</p>
}
