<main class="lobby-page">
  <div class="lobby-shell">
    <header class="lobby-header">
      <div class="lobby-brand">
        <span class="brand-suits" aria-hidden="true"><i>♠</i><i>♥</i></span>
        <span>TRUNOCRAZZY/RANKING</span>
        <span class="brand-suits" aria-hidden="true"><i>♦</i><i>♣</i></span>
      </div>
      <nav class="lobby-nav" aria-label="Navegação principal">
        <button type="button" (click)="go($event, '/lobby')">Início</button>
        <button type="button" (click)="go($event, '/perfil')">Perfil</button>
        <button type="button" (click)="go($event, '/ranking')">Ranking</button>
      </nav>
    </header>

    <h1 class="text-3xl font-bold">Ranking</h1>

    <!-- Passo 3: carregando / erro -->
    <p>Carregando ranking...</p>
    <p role="alert" class="text-error">Mensagem de erro fica aqui.</p>

    <!-- Passo 2 e 4: uma linha por jogador; destaque a linha do jogador logado -->
    <table class="table">
      <thead>
        <tr>
          <th>#</th>
          <th>Jogador</th>
          <th>Pontos</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>apelido</td>
          <td>0</td>
        </tr>
      </tbody>
    </table>

    <p>Nenhum jogador no ranking.</p>
  </div>
</main>
