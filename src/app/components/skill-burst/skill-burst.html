<span class="burst">
  <span class="emoji">{{ icon }}</span>
  @if (isSurprise) {
    <span class="surprise-particles">
      @for (particle of particles; track particle) {
        <i class="surprise-particle" [style.--angle]="(particle / particles.length * 360) + 'deg'"></i>
      }
    </span>
    @if (roll !== null) {
      <span class="surprise-outcome">{{ outcomeText }}</span>
    }
  }
</span>
