<section id="catalago de cartas"
  class="container min-w-screen grid grid-colors-1 md:grid-cols-2 lg:grid-cols-4 justify-items-center gap-4 py-8">

  @for (card of cards; track card.id) {
  <div class="hover-3d">
    <!-- content -->
    <figure class="card-sprite w-60 overflow-hidden rounded-2xl p-2"
    role="img"
    [attr.aria-label]="card.valor + ' de ' + card.naipe.toLocaleUpperCase()"
    >
      <img 
        aria-hidden="true"
        class="card-sprite__sheet"
        [src]="card.url"
        alt=""
        loading="lazy"
        [style.left]="card.spriteOffset"
      />
    </figure>
    <!-- 8 empty divs needed for the 3D effect -->
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
  </div>

  }
</section>
