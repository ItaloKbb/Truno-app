@switch (page()) {
  @case ('home') {
    <app-home [auth]="auth" (loggedIn)="onLoggedIn()" />
  }
  @case ('book') {
    <app-book [service]="cardService" (navigate)="navigate($event)" />
  }
  @case ('lobby') {
    <app-lobby [games]="gameService" (navigate)="navigate($event)" />
  }
  @case ('partida/:id') {
    <app-partida />
  }
  @case ('ranking') {
    <app-ranking />
  }
  @case ('perfil') {
    <app-profile [profiles]="profileService" (navigate)="navigate($event)" />
  }
}
